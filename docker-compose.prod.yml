services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: repo-intelligence-agent:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # ── Application ────────────────────────────────────────────────────────
      - APP_ENV=production
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=${API_SERVER_PORT:-8001}
      - PORT=${PORT:-${API_SERVER_PORT:-8001}}
      - WORKER_COUNT=${WORKER_COUNT:-${ARIA_WORKERS:-${WEB_CONCURRENCY:-4}}}
      - WEB_CONCURRENCY=${WORKER_COUNT:-${ARIA_WORKERS:-${WEB_CONCURRENCY:-4}}}
      - ARIA_WORKERS=${WORKER_COUNT:-${ARIA_WORKERS:-${WEB_CONCURRENCY:-4}}}

      # ── Observability ──────────────────────────────────────────────────────
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - SLOW_REQUEST_THRESHOLD_SECONDS=${SLOW_REQUEST_THRESHOLD_SECONDS:-2.0}

      # ── Authentication / security ──────────────────────────────────────────
      # APIKeyMiddleware refuses to start with APP_ENV=production and no API_KEY.
      - API_KEY=${API_KEY:?API_KEY is required when APP_ENV=production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required when APP_ENV=production}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}

      # ── LLM provider ───────────────────────────────────────────────────────
      # Startup validation fails fast in production when no provider is healthy.
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-ai/deepseek-v4-flash}

      # ── GitHub ─────────────────────────────────────────────────────────────
      - GITHUB_TOKEN=${GITHUB_TOKEN}

      # ── Storage & Vector Store ─────────────────────────────────────────────
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-data/repo_understanding.db}
      - CHROMA_DB_PATH=${CHROMA_DB_PATH:-data/chroma_db}
      - VECTOR_STORE_BACKEND=${VECTOR_STORE_BACKEND:-qdrant}
      - VECTOR_STORE_ENABLE_FALLBACK=${VECTOR_STORE_ENABLE_FALLBACK:-true}
      - QDRANT_URL=${QDRANT_URL:-http://127.0.0.1:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - QDRANT_PREFER_GRPC=${QDRANT_PREFER_GRPC:-false}
      - QDRANT_TIMEOUT=${QDRANT_TIMEOUT:-10.0}
      - QDRANT_RETRY_ATTEMPTS=${QDRANT_RETRY_ATTEMPTS:-2}
      - CLONED_REPOS_PATH=/home/appuser/.repo_intelligence/cloned_repos

      # ── Frontend / CORS ────────────────────────────────────────────────────
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4321}

      # ── Build / cache ──────────────────────────────────────────────────────
      - BUILD_TIMEOUT=${BUILD_TIMEOUT:-1800}
      - CACHE_SIZE_LIMIT=${CACHE_SIZE_LIMIT:-1000}
    volumes:
      - repo-intel-data:/app/data
      - repo-intel-cloned:/home/appuser/.repo_intelligence/cloned_repos
      - repo-intel-model-cache:/home/appuser/.cache

volumes:
  repo-intel-data:
  repo-intel-cloned:
  repo-intel-model-cache:
