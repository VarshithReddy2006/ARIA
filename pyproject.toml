[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-intelligence-agent"
version = "1.5.0"
description = "Production-grade codebase intelligence agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "networkx>=3.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.4.0",
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-python>=0.21.0,<0.22.0",
    "tree-sitter-javascript>=0.21.0,<0.22.0",
    "tree-sitter-typescript>=0.21.0,<0.22.0",
    "google-genai>=0.1.1",
    # Pinned below 2.x: SDK 2.x removed mcp.server.fastmcp / FastMCP.
    # See docs/MCP_RELEASE_READINESS.md.
    "mcp[cli]>=1.0.0,<2",
]

[project.scripts]
repo-intel = "backend.cli:app"

[tool.ruff.lint]
# Pinned explicitly to the rule set this repository has always been linted
# against. Ruff 0.16.0 expanded its implicit default selection from 59 to 413
# rules, so relying on the default made `ruff check .` change meaning on every
# Ruff upgrade. Declaring the selection keeps CI deterministic across versions.
# Widening this set is a deliberate, staged decision: the newly-default rules
# report ~5.9k findings, many of which (FA100, BLE001, UP045, B008) would alter
# runtime annotation evaluation, exception handling, or FastAPI dependency
# defaults rather than being mechanical cleanups.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "node_modules", "frontend", "cloned_repos"]
