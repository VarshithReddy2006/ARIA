# Declarative Azure Container Apps Job manifest for ARIA Background Worker
type: Microsoft.App/jobs
name: aria-worker-job
location: eastasia
properties:
  environmentId: /subscriptions/3ab8ccbd-89d3-4eba-b8ac-81544e33c4c0/resourceGroups/aria-rg/providers/Microsoft.App/managedEnvironments/aria-env
  configuration:
    triggerType: Event
    replicaTimeout: 3600
    replicaRetryLimit: 3
    eventTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
      scale:
        minExecutions: 0
        maxExecutions: 5
        pollingInterval: 15
        rules:
          - name: queue-rule
            type: azure-queue
            metadata:
              queueName: aria-analysis-jobs
              queueLength: 1
            auth:
              - secretRef: storage-conn
                triggerParameter: connection
    secrets:
      - name: storage-conn
        value: "<AZURE_STORAGE_CONNECTION_STRING>"
      - name: gemini-key
        value: "<GEMINI_API_KEY>"
      - name: ariacr3ab8azurecrio-ariacr3ab8
        value: "<ACR_PASSWORD>"
    registries:
      - server: ariacr3ab8.azurecr.io
        username: ariacr3ab8
        passwordSecretRef: ariacr3ab8azurecrio-ariacr3ab8
  template:
    volumes:
      - name: aria-data-volume
        storageType: AzureFile
        storageName: ariadata
    containers:
      - image: ariacr3ab8.azurecr.io/aria-worker:<IMAGE_TAG>
        name: aria-worker
        resources:
          cpu: 2.0
          memory: 4.0Gi
        env:
          - name: AZURE_STORAGE_QUEUE_NAME
            value: aria-analysis-jobs
          - name: AZURE_STORAGE_CONNECTION_STRING
            secretRef: storage-conn
          - name: GEMINI_API_KEY
            secretRef: gemini-key
          - name: SQLITE_DB_PATH
            value: /tmp/repo_understanding.db
          - name: ANALYSIS_STORE_PATH
            value: /app/data/analysis_store.json
          - name: APP_ENV
            value: production
          - name: ALLOWED_HOSTS
            value: aria-api.lemonriver-308dc42a.eastasia.azurecontainerapps.io
          - name: JOB_STATE_DIR
            value: /app/data/jobs
        volumeMounts:
          - volumeName: aria-data-volume
            mountPath: /app/data
