name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ruff is pinned: 0.16.0 changed the default rule selection and added
          # Markdown formatting, which broke this job without any code change.
          pip install ruff==0.16.1 pytest pytest-asyncio httpx pytest-cov==5.0.0
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            FILES=$(git diff --name-only --diff-filter=d "$BASE_REF"...HEAD -- '*.py')
          elif [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=d "${{ github.event.before }}" HEAD -- '*.py')
          else
            FILES=$(git diff --name-only --diff-filter=d HEAD~1 HEAD -- '*.py' 2>/dev/null || true)
          fi

          if [ -n "$FILES" ]; then
            echo "Checking formatting for changed Python files:"
            echo "$FILES"
            echo "$FILES" | xargs ruff format --check
          else
            echo "No changed Python files to check formatting for."
          fi

      - name: Run tests with coverage gate
        env:
          PYTHONPATH: .
        run: >-
          pytest tests/ -v
          --cov=agents --cov=backend --cov=core --cov=memory --cov=mcp
          --cov=models --cov=ria --cov=services --cov=storage --cov=utils
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=50

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  vscode-extension-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: npm test
