    print("python.language() =", tree_sitter_python.language())
    print("python.type =", type(tree_sitter_python.language()))

    print("javascript.language() =", tree_sitter_javascript.language())
    print("javascript.type =", type(tree_sitter_javascript.language()))

    print("typescript.language() =", tree_sitter_typescript.language())
    print("typescript.type =", type(tree_sitter_typescript.language()))

    from tree_sitter import Language, Parser

    try:
        lang = Language(tree_sitter_python.language(), "python")
        print("✓ Language() succeeded")
